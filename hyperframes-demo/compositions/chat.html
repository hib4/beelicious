  <script>
    (function () {
      const B = 0.4651; // 129 BPM
      const tl = gsap.timeline({ paused: true });
      // Static layout from line counts (no DOM measurement): bubble = 12 + 38·lines + 12·blank + 34 (time row).
      const T = {};
      (function layout() {
        let y = 16;
        document.querySelectorAll("#ph .trk > .m:not(.ty)").forEach((el) => {
          const nl = el.querySelectorAll(".l").length, ns = el.querySelectorAll(".s").length;
          let h = 12 + 38 * nl + 12 * ns + 34;
          if (el.classList.contains("mo")) h = 62;
          if (el.classList.contains("dc")) h = 44;
          if (el.classList.contains("mimg")) h += 564;
          el.style.top = y + "px";
          T[el.id] = { top: y, bottom: y + h, h };
          y += h + 14;
        });
      })();
      const AREA = 772;
      const fit = (id) => Math.min(0, AREA - 16 - T[id].bottom);          // newest message's bottom above the input bar
      const fitTop = (id) => Math.min(0, 16 - T[id].top);                 // a tall message: its top
      const fitTyping = (id) => Math.min(0, AREA - 16 - (T[id].top + 58)); // the typing dots where the message will appear
      gsap.set("#ph .mk", { scaleX: 0 });
      // the bot is typing, then its message arrives
      const botSays = (id, at, view) => {
        tl.set("#ty", { top: T[id].top, opacity: 1 }, at - 0.42);
        tl.to("#ph .trk", { y: fitTyping(id), duration: 0.3, ease: "power3.inOut" }, at - 0.44);
        tl.fromTo("#ty i", { y: 0 }, { y: -7, duration: 0.1, ease: "sine.inOut", yoyo: true, repeat: 1, stagger: 0.07, immediateRender: false }, at - 0.4);
        tl.set("#ty", { opacity: 0 }, at);
        tl.fromTo("#" + id, { opacity: 0, scale: 0.92, transformOrigin: "0% 100%" }, { opacity: 1, scale: 1, duration: 0.18, ease: "back.out(1.6)", immediateRender: false }, at);
        tl.to("#ph .trk", { y: view === undefined ? fit(id) : view, duration: 0.32, ease: "power3.inOut" }, at);
      };
      // the student types the number and sends it
      const iSend = (inId, outId, at) => {
        tl.set("#phd", { opacity: 0 }, at - 0.32);
        tl.set("#" + inId, { opacity: 1 }, at - 0.32);
        tl.to("#snd", { scale: 0.88, duration: 0.08, ease: "power2.in" }, at - 0.1);
        tl.to("#snd", { scale: 1, duration: 0.16, ease: "power2.out" }, at - 0.02);
        tl.set("#" + inId, { opacity: 0 }, at);
        tl.set("#phd", { opacity: 1 }, at);
        tl.fromTo("#" + outId, { opacity: 0, y: 46, scale: 0.94, transformOrigin: "100% 100%" }, { opacity: 1, y: 0, scale: 1, duration: 0.22, ease: "power3.out", immediateRender: false }, at);
        tl.to("#ph .trk", { y: fit(outId), duration: 0.3, ease: "power3.inOut" }, at);
        tl.to("#" + outId + " .tk.bl", { opacity: 1, duration: 0.1, ease: "none" }, at + 0.35);
      };
      const mark = (sel, at) => tl.to(sel, { scaleX: 1, duration: 0.24, ease: "expo.out" }, at);
      const titleIn = (sel, at) => tl.fromTo(sel, { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.15, ease: "power4.out", immediateRender: false }, at);
      const out = (sel, at) => tl.to(sel, { opacity: 0, filter: "blur(10px)", duration: 0.12, ease: "power3.in" }, at);

      // the phone arrives as "Halo" is sent (typed in the hook)
      gsap.set(["#ph .trk > .m:not(#dc):not(#o0)"], { opacity: 0 });
      tl.fromTo("#ph", { y: 1100 }, { y: 0, duration: 0.42, ease: "power3.out", immediateRender: true }, 0);
      tl.fromTo("#o0", { opacity: 0, y: 46 }, { opacity: 1, y: 0, duration: 0.22, ease: "power3.out", immediateRender: true }, 0.3);
      tl.to("#o0 .tk.bl", { opacity: 1, duration: 0.1, ease: "none" }, 0.62);
      // five exchanges: the bot asks, the student replies with a number
      const A = [0, 0.9, 6 * B + 0.35, 12 * B + 0.35, 18 * B + 0.35, 24 * B + 0.35];
      const P = [0, 4 * B, 9 * B, 15 * B, 21 * B, 27 * B];
      for (let k = 1; k <= 5; k++) {
        if (k > 1) out(["#t" + (k - 1), "#r" + (k - 1)], A[k] - 0.3);
        botSays("b" + k, A[k]);
        titleIn("#t" + k, A[k] + 0.05);
        iSend("i" + k, "o" + k, P[k]);
        mark("#b" + k + " .mk", P[k] + 0.04);
        titleIn("#r" + k, P[k] + 0.06);
      }
      // the ground turns parchment behind the phone
      const END = 30 * B;
      out(["#t5", "#r5"], END - 0.55);
      tl.to("#wipe", { clipPath: "inset(0% 0% 0% 0%)", duration: 0.42, ease: "power3.inOut" }, END - 0.45);
      window.__timelines = window.__timelines || {};
      window.__timelines["chat"] = tl;
    })();
  </script>
