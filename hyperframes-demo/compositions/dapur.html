  <script>
    (function () {
      const B = 0.4651; // 129 BPM
      const tl = gsap.timeline({ paused: true });
      // Static layout from line counts (no DOM measurement): bubble = 12 + 38·lines + 12·blank + 34 (time row).
      const T = {};
      (function layout() {
        let y = 16;
        document.querySelectorAll("#ph .trk > .m:not(.ty)").forEach((el) => {
          const nl = el.querySelectorAll(".l").length, ns = el.querySelectorAll(".s").length;
          let h = 12 + 38 * nl + 12 * ns + 34;
          if (el.classList.contains("mo")) h = 62;
          if (el.classList.contains("dc")) h = 44;
          if (el.classList.contains("mimg")) h += 564;
          el.style.top = y + "px";
          T[el.id] = { top: y, bottom: y + h, h };
          y += h + 14;
        });
      })();
      const AREA = 772;
      const fit = (id) => Math.min(0, AREA - 16 - T[id].bottom);          // newest message's bottom above the input bar
      const fitTop = (id) => Math.min(0, 16 - T[id].top);                 // a tall message: its top
      const fitTyping = (id) => Math.min(0, AREA - 16 - (T[id].top + 58)); // the typing dots where the message will appear
      gsap.set("#ph .mk", { scaleX: 0 });
      // the bot is typing, then its message arrives
      const botSays = (id, at, view) => {
        tl.set("#ty", { top: T[id].top, opacity: 1 }, at - 0.42);
        tl.to("#ph .trk", { y: fitTyping(id), duration: 0.3, ease: "power3.inOut" }, at - 0.44);
        tl.fromTo("#ty i", { y: 0 }, { y: -7, duration: 0.1, ease: "sine.inOut", yoyo: true, repeat: 1, stagger: 0.07, immediateRender: false }, at - 0.4);
        tl.set("#ty", { opacity: 0 }, at);
        tl.fromTo("#" + id, { opacity: 0, scale: 0.92, transformOrigin: "0% 100%" }, { opacity: 1, scale: 1, duration: 0.18, ease: "back.out(1.6)", immediateRender: false }, at);
        tl.to("#ph .trk", { y: view === undefined ? fit(id) : view, duration: 0.32, ease: "power3.inOut" }, at);
      };
      // the student types the number and sends it
      const iSend = (inId, outId, at) => {
        tl.set("#phd", { opacity: 0 }, at - 0.32);
        tl.set("#" + inId, { opacity: 1 }, at - 0.32);
        tl.to("#snd", { scale: 0.88, duration: 0.08, ease: "power2.in" }, at - 0.1);
        tl.to("#snd", { scale: 1, duration: 0.16, ease: "power2.out" }, at - 0.02);
        tl.set("#" + inId, { opacity: 0 }, at);
        tl.set("#phd", { opacity: 1 }, at);
        tl.fromTo("#" + outId, { opacity: 0, y: 46, scale: 0.94, transformOrigin: "100% 100%" }, { opacity: 1, y: 0, scale: 1, duration: 0.22, ease: "power3.out", immediateRender: false }, at);
        tl.to("#ph .trk", { y: fit(outId), duration: 0.3, ease: "power3.inOut" }, at);
        tl.to("#" + outId + " .tk.bl", { opacity: 1, duration: 0.1, ease: "none" }, at + 0.35);
      };
      const mark = (sel, at) => tl.to(sel, { scaleX: 1, duration: 0.24, ease: "expo.out" }, at);
      const titleIn = (sel, at) => tl.fromTo(sel, { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.15, ease: "power4.out", immediateRender: false }, at);
      const out = (sel, at) => tl.to(sel, { opacity: 0, filter: "blur(10px)", duration: 0.12, ease: "power3.in" }, at);
      // camera: screen = s * native + (x, y)
      const shot = (s, cx, cy) => ({ scale: s, x: 960 - s * cx, y: 540 - s * cy });
      // cursor tip sits at (25, 15) inside its 120 px box
      const at = (tx, ty) => ({ x: tx - 25, y: ty - 15 });
      const press = (t) => {
        tl.to("#cur", { scale: 0.9, transformOrigin: "21% 12%", duration: 0.1, ease: "power2.in" }, t);
        tl.to("#cur", { scale: 1, duration: 0.2, ease: "power2.out" }, t + 0.1);
      };
      const swap = (from, to, t, pop = 1.25) => {
        tl.set(from, { opacity: 0 }, t);
        tl.fromTo(to, { opacity: 0, scale: pop, transformOrigin: "0% 50%" }, { opacity: 1, scale: 1, duration: 0.22, ease: "back.out(2.5)", immediateRender: false }, t);
      };

      gsap.set("#cam", { scale: 1, x: 0, y: 0 });
      gsap.set("#row > div", { opacity: 0 });
      gsap.set("#cur", at(2100, 1200));
      gsap.set(["#ch1", "#ch2", "#ch3", "#nx1", "#nx2", "#nx3", "#bt1", "#bt2", "#bt3", "#dt1", "#dt2"], { opacity: 0 });
      gsap.set("#ph", { x: 700 });
      gsap.set(["#nb1", "#nb2", "#nb3"], { opacity: 0 });
      gsap.set("#ph .trk", { y: fit("b10") });

      // the order lands in the merchant's table
      // the pan from bayar continues: the dashboard slides in from the right and settles
      tl.fromTo("#cam", { x: 1500 }, { x: 0, duration: 0.5, ease: "power3.out", immediateRender: true }, 0);
      // the paid order arrives as a new row, briefly highlighted
      tl.fromTo("#row > div", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.15, ease: "power4.out", stagger: 0.04, immediateRender: false }, 0.55);
      tl.fromTo("#row", { backgroundColor: "rgba(253, 196, 61, 0.45)" }, { backgroundColor: "rgba(253, 196, 61, 0)", duration: 1.2, ease: "power2.out", immediateRender: false }, 0.55);

      // push in on payment + fulfilment, then pan to the order number
      tl.to("#cam", { ...shot(2.2, 1430, 330), duration: 0.5, ease: "power2.inOut" }, 2 * B);
      tl.to("#cam", { ...shot(2.2, 720, 330), duration: 0.45, ease: "power2.inOut" }, 5 * B);
      // the cursor opens the order
      tl.to("#cur", { ...at(2.2 * 500 + (960 - 2.2 * 720), 2.2 * 303 + (540 - 2.2 * 330)), duration: 0.45, ease: "power3.out" }, 6 * B);
      press(7 * B);
      const Z = 7 * B + 0.12;
      tl.to("#cam", { ...shot(7, 520, 311), opacity: 0, filter: "blur(12px)", duration: 0.34, ease: "power3.in" }, Z);
      tl.fromTo("#split", { opacity: 0, filter: "blur(10px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power3.out", immediateRender: false }, Z + 0.26);
      tl.to("#ph", { x: 0, duration: 0.35, ease: "power3.out" }, Z + 0.26);

      const BTN = at(72 + 2.4 * 80, 58 + 2.4 * 207);
      const OK = at(72 + 2.4 * 372, 58 + 2.4 * 225); // Konfirmasi measured at (973, 596) on screen
      // after the first confirm the dashboard stays pushed in (top-left anchored) so the status chips read bigger
      const Zs = 1.35;
      const BTNZ = at(72 + Zs * 2.4 * 80, 58 + Zs * 2.4 * 207);
      const advance = (st, t, pop) => {
        swap(st.chip[0], st.chip[1], t, pop);
        tl.set(st.next[0], { opacity: 0 }, t);
        tl.set(st.next[1], { opacity: 1 }, t);
        tl.set(st.btn[0], { opacity: 0 }, t);
        tl.set(st.btn[1], { opacity: 1 }, t);
      };

      // step 1, shown in full: Terima pesanan → confirm dialog → Konfirmasi
      const t1 = 9 * B;
      tl.to("#cur", { ...BTN, duration: 0.4, ease: "power3.out" }, t1 - 0.42);
      press(t1);
      tl.set("#dt0", { opacity: 1 }, t1 + 0.1);
      tl.fromTo("#back", { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "none", immediateRender: false }, t1 + 0.1);
      tl.fromTo("#dlg", { opacity: 0, scale: 0.94, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.15, ease: "power3.out", immediateRender: false }, t1 + 0.1);
      tl.to("#cur", { ...OK, duration: 0.28, ease: "power3.out" }, t1 + 0.44);
      const c1 = t1 + 0.8;
      press(c1);
      tl.to(["#dlg", "#back"], { opacity: 0, duration: 0.08, ease: "power3.in" }, c1 + 0.1);
      advance({ chip: ["#ch0", "#ch1"], next: ["#nx0", "#nx1"], btn: ["#bt0", "#bt1"] }, c1 + 0.14, 1.8);
      // the camera punches in on the new status
      tl.to("#stk", { scale: Zs, transformOrigin: "0px 0px", duration: 0.3, ease: "power2.out" }, c1 + 0.14);
      tl.fromTo("#notice", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.15, ease: "power4.out", immediateRender: false }, c1 + 0.2);
      botSays("nb1", c1 + 0.5);

      // steps 2 and 3: the merchant already knows the dialog, so one click on the action, then time to read
      const step = (st, p) => {
        tl.to("#cur", { ...BTNZ, duration: 0.4, ease: "power3.out" }, p - 0.42);
        press(p);
        advance(st, p + 0.14, 1.8);
        tl.to("#cur", { x: "+=150", y: "+=110", duration: 0.35, ease: "power2.out" }, p + 0.3);
        botSays(st.nb, p + 0.6);
      };
      step({ chip: ["#ch1", "#ch2"], next: ["#nx1", "#nx2"], btn: ["#bt1", "#bt2"], nb: "nb2" }, 12 * B + 0.2);
      step({ chip: ["#ch2", "#ch3"], next: ["#nx2", "#nx3"], btn: ["#bt2", "#bt3"], nb: "nb3" }, 15 * B + 0.2);

      // the cursor leaves; the customer's chat takes the frame
      tl.to("#cur", { x: 1300, y: 1250, duration: 0.3, ease: "power2.in" }, 17.6 * B);
      tl.to("#stk", { x: -700, opacity: 0, filter: "blur(10px)", duration: 0.5, ease: "power3.in" }, 18.6 * B);
      tl.to("#ph", { x: 1056 - 1300, duration: 0.6, ease: "power3.inOut" }, 20 * B - 0.62);
      window.__timelines = window.__timelines || {};
      window.__timelines["dapur"] = tl;
    })();
  </script>
</template>
