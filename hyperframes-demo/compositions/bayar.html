  <script>
    (function () {
      const B = 0.4651; // 129 BPM
      const tl = gsap.timeline({ paused: true });
      // Static layout from line counts (no DOM measurement): bubble = 12 + 38·lines + 12·blank + 34 (time row).
      const T = {};
      (function layout() {
        let y = 16;
        document.querySelectorAll("#ph .trk > .m:not(.ty)").forEach((el) => {
          const nl = el.querySelectorAll(".l").length, ns = el.querySelectorAll(".s").length;
          let h = 12 + 38 * nl + 12 * ns + 34;
          if (el.classList.contains("mo")) h = 62;
          if (el.classList.contains("dc")) h = 44;
          if (el.classList.contains("mimg")) h += 564;
          el.style.top = y + "px";
          T[el.id] = { top: y, bottom: y + h, h };
          y += h + 14;
        });
      })();
      const AREA = 772;
      const fit = (id) => Math.min(0, AREA - 16 - T[id].bottom);          // newest message's bottom above the input bar
      const fitTop = (id) => Math.min(0, 16 - T[id].top);                 // a tall message: its top
      const fitTyping = (id) => Math.min(0, AREA - 16 - (T[id].top + 58)); // the typing dots where the message will appear
      gsap.set("#ph .mk", { scaleX: 0 });
      // the bot is typing, then its message arrives
      const botSays = (id, at, view) => {
        tl.set("#ty", { top: T[id].top, opacity: 1 }, at - 0.42);
        tl.to("#ph .trk", { y: fitTyping(id), duration: 0.3, ease: "power3.inOut" }, at - 0.44);
        tl.fromTo("#ty i", { y: 0 }, { y: -7, duration: 0.1, ease: "sine.inOut", yoyo: true, repeat: 1, stagger: 0.07, immediateRender: false }, at - 0.4);
        tl.set("#ty", { opacity: 0 }, at);
        tl.fromTo("#" + id, { opacity: 0, scale: 0.92, transformOrigin: "0% 100%" }, { opacity: 1, scale: 1, duration: 0.18, ease: "back.out(1.6)", immediateRender: false }, at);
        tl.to("#ph .trk", { y: view === undefined ? fit(id) : view, duration: 0.32, ease: "power3.inOut" }, at);
      };
      // the student types the number and sends it
      const iSend = (inId, outId, at) => {
        tl.set("#phd", { opacity: 0 }, at - 0.32);
        tl.set("#" + inId, { opacity: 1 }, at - 0.32);
        tl.to("#snd", { scale: 0.88, duration: 0.08, ease: "power2.in" }, at - 0.1);
        tl.to("#snd", { scale: 1, duration: 0.16, ease: "power2.out" }, at - 0.02);
        tl.set("#" + inId, { opacity: 0 }, at);
        tl.set("#phd", { opacity: 1 }, at);
        tl.fromTo("#" + outId, { opacity: 0, y: 46, scale: 0.94, transformOrigin: "100% 100%" }, { opacity: 1, y: 0, scale: 1, duration: 0.22, ease: "power3.out", immediateRender: false }, at);
        tl.to("#ph .trk", { y: fit(outId), duration: 0.3, ease: "power3.inOut" }, at);
        tl.to("#" + outId + " .tk.bl", { opacity: 1, duration: 0.1, ease: "none" }, at + 0.35);
      };
      const mark = (sel, at) => tl.to(sel, { scaleX: 1, duration: 0.24, ease: "expo.out" }, at);
      const titleIn = (sel, at) => tl.fromTo(sel, { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.15, ease: "power4.out", immediateRender: false }, at);
      const out = (sel, at) => tl.to(sel, { opacity: 0, filter: "blur(10px)", duration: 0.12, ease: "power3.in" }, at);

      // the QR art: three finder squares and a seeded pattern; not a scannable code
      (function () {
        const N = 29; let seed = 1125;
        const rnd = () => ((seed = (seed * 1103515245 + 12345) % 2147483648) / 2147483648);
        const inF = (x, y) => (x < 7 && y < 7) || (x >= N - 7 && y < 7) || (x < 7 && y >= N - 7);
        const fOn = (x, y) => { const fx = x >= N - 7 ? x - (N - 7) : x, fy = y >= N - 7 ? y - (N - 7) : y; return Math.max(Math.abs(fx - 3), Math.abs(fy - 3)) !== 2; };
        const sep = (x, y) => (x <= 7 && y <= 7) || (x >= N - 8 && y <= 7) || (x <= 7 && y >= N - 8);
        let s = "";
        for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
          const on = inF(x, y) ? fOn(x, y) : sep(x, y) ? false : rnd() < 0.5;
          if (on) s += '<rect class="qm" x="' + x + '" y="' + y + '" width="1" height="1" fill="#1D1B1B"/>';
        }
        document.getElementById("qr-svg").innerHTML = s;
        document.querySelectorAll("#ord .w").forEach((w) => { w.innerHTML = [...w.textContent].map((ch) => '<span class="c">' + ch + "</span>").join(""); });
      })();
      gsap.set(["#b8", "#b9", "#b10"], { opacity: 0 });
      gsap.set(["#b6 .mk", "#b7 .mk"], { scaleX: 1 });
      gsap.set(["#o6 .tk.bl", "#o7 .tk.bl"], { opacity: 1 });
      gsap.set(".qm", { opacity: 0 });
      gsap.set("#okc", { strokeDasharray: 190, strokeDashoffset: 190 });
      gsap.set("#ph .trk", { y: fit("o7") });

      // beats 0–10: the order exists; its number is typed out; the total is marked
      botSays("b8", 0.42);
      titleIn("#t8", 0.47);
      document.querySelectorAll("#ord .c").forEach((el, i) => tl.set(el, { opacity: 1 }, 2 * B + i * 0.07));
      mark("#b8 .mk", 7 * B);
      // beat 11: one beat of silence; beat 12 (the drop): the total
      out(["#t8", "#ord"], 11 * B - 0.12);
      const PAY = 12 * B;
      tl.fromTo("#tot", { opacity: 0, scale: 1.22, filter: "blur(14px)", transformOrigin: "0% 60%" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.18, ease: "expo.out", immediateRender: false }, PAY);
      tl.fromTo("#tot", { x: 0 }, { keyframes: [{ x: -10, duration: 1 / 60 }, { x: 9, duration: 1 / 60 }, { x: -5, duration: 1 / 60 }, { x: 0, duration: 1 / 60 }], immediateRender: false }, PAY + 0.02);
      // beat 15: the QRIS image arrives in the chat
      const Q = 15 * B;
      tl.to("#tot", { x: -1100, filter: "blur(18px)", duration: 0.24, ease: "power3.in" }, Q - 0.24);
      botSays("b9", Q + 0.1, fitTop("b9"));
      titleIn("#t9", Q + 0.1);
      titleIn("#s9", Q + 0.3);
      tl.to(".qm", { opacity: 1, duration: 0.05, ease: "none", stagger: { each: 0.0012, grid: [29, 29], from: "center" } }, Q + 0.25);
      tl.to("#ph .trk", { y: fit("b9"), duration: 0.6, ease: "power2.inOut" }, 18 * B);
      // beat 20: paid — the verification arrives
      const V = 20 * B;
      out(["#t9", "#s9"], V - 0.3);
      botSays("b10", V);
      titleIn(["#t10", "#ok"], V + 0.05);
      tl.to("#okc", { strokeDashoffset: 0, duration: 0.3, ease: "power2.out" }, V + 0.15);
      mark("#b10 .mk", V + 2 * B);
      titleIn("#s10", V + 2 * B + 0.1);
      // the end: the camera pans from the student's phone to the merchant — the phone leaves left,
      // parchment (the dashboard's ground) sweeps in from the right; dapur continues the same move
      const PAN = 28 * B - 0.6;
      out(["#t10", "#ok", "#s10"], PAN - 0.12);
      tl.to("#ph", { x: -1700, duration: 0.6, ease: "power3.in" }, PAN);
      tl.to("#pan", { clipPath: "inset(0% 0% 0% 0%)", duration: 0.6, ease: "power3.in" }, PAN);
      window.__timelines = window.__timelines || {};
      window.__timelines["bayar"] = tl;
    })();
  </script>
